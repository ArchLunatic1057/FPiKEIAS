<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Суммарные затраты на создание и внедрение</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Расчёт суммарных затрат на создание и внедрение ИАС (К)</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="costsForm">
                            <div class="mb-3">
                                <label class="form-label">Годовые текущие издержки на функционирование (И₂), руб.</label>
                                <input type="number" step="any" id="i2" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Единовременные затраты на создание (Р), руб.</label>
                                <input type="number" step="any" id="p_single" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Способ определения коэффициента реновации k<sub>р</sub>:</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="kp_method" id="kp_table" value="table" checked>
                                    <label class="form-check-label" for="kp_table">Из таблицы по сроку службы</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="kp_method" id="kp_formula" value="formula">
                                    <label class="form-check-label" for="kp_formula">По формуле (с использованием срока службы)</label>
                                </div>
                            </div>

                            <div id="table_input" class="mb-3">
                                <label class="form-label">Срок службы средств технического обеспечения (Т<sub>сл</sub>), лет</label>
                                <select id="tsl_table" class="form-select">
                                    <option value="1">1 (kp = 1.0000)</option><option value="2">2 (kp = 0.4762)</option>
                                    <option value="3">3 (kp = 0.3021)</option><option value="4">4 (kp = 0.2155)</option>
                                    <option value="5">5 (kp = 0.1638)</option><option value="6">6 (kp = 0.1296)</option>
                                    <option value="7">7 (kp = 0.1054)</option><option value="8">8 (kp = 0.0874)</option>
                                    <option value="9">9 (kp = 0.0736)</option><option value="10">10 (kp = 0.0627)</option>
                                    <option value="11">11 (kp = 0.0540)</option><option value="12">12 (kp = 0.0468)</option>
                                    <option value="13">13 (kp = 0.0408)</option><option value="14">14 (kp = 0.0352)</option>
                                    <option value="15">15 (kp = 0.0315)</option>
                                </select>
                            </div>

                            <div id="formula_input" class="mb-3" style="display: none;">
                                <label class="form-label">Срок службы средств технического обеспечения (Т<sub>сл</sub>), лет</label>
                                <input type="number" step="0.1" id="tsl_formula" class="form-control">
                            </div>

                            <button type="button" class="btn btn-primary" onclick="calculateTotalCosts()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результаты:</h4>
                        <div id="costsResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        const EN = 0.2;
        const KP_TABLE = {1:1.0000,2:0.4762,3:0.3021,4:0.2155,5:0.1638,6:0.1296,7:0.1054,8:0.0874,9:0.0736,10:0.0627,11:0.0540,12:0.0468,13:0.0408,14:0.0352,15:0.0315};
        
        document.querySelectorAll('input[name="kp_method"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('table_input').style.display = this.value === 'table' ? 'block' : 'none';
                document.getElementById('formula_input').style.display = this.value === 'formula' ? 'block' : 'none';
            });
        });
        
        function calculateTotalCosts() {
            const I2 = parseFloat(document.getElementById('i2').value);
            const P_single = parseFloat(document.getElementById('p_single').value);
            const method = document.querySelector('input[name="kp_method"]:checked').value;
            
            if (isNaN(I2) || isNaN(P_single)) {
                document.getElementById('costsResult').innerHTML = '<div class="alert alert-danger">Проверьте введённые данные</div>';
                return;
            }
            
            let kp;
            if (method === 'table') {
                const Tsl = parseInt(document.getElementById('tsl_table').value);
                kp = KP_TABLE[Tsl];
            } else {
                const Tsl = parseFloat(document.getElementById('tsl_formula').value);
                if (isNaN(Tsl)) {
                    document.getElementById('costsResult').innerHTML = '<div class="alert alert-danger">Введите срок службы</div>';
                    return;
                }
                kp = EN / (Math.pow(1 + EN, Tsl) - 1);
            }
            
            const K = I2 + (kp + EN) * P_single;
            document.getElementById('costsResult').innerHTML = `
                <ul class="list-group">
                    <li class="list-group-item">Коэффициент реновации k<sub>р</sub> = ${kp.toFixed(4)}</li>
                    <li class="list-group-item">Суммарные затраты К = И₂ + (k<sub>р</sub> + Е<sub>н</sub>)·Р = ${K.toFixed(2)} руб.</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
