<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трудоёмкость разработки ПО</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Оценка трудоёмкости и длительности разработки ПО</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="softwareForm">
                            <div class="mb-3">
                                <label class="form-label">Объём программы n, тыс. исходных команд</label>
                                <input type="number" step="0.01" id="n" class="form-control" required>
                            </div>
                            <button type="button" class="btn btn-primary" onclick="calculateSoftware()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результаты:</h4>
                        <div id="softwareResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        function calculateSoftware() {
            const n = parseFloat(document.getElementById('n').value);
            
            if (isNaN(n) || n <= 0) {
                document.getElementById('softwareResult').innerHTML = '<div class="alert alert-danger">Некорректное значение n</div>';
                return;
            }
            
            const t = 3.6 * Math.pow(n, 1.2);
            const T = 2.5 * Math.pow(t, 0.32);
            const Pr = 1000 * n / t;
            const Ch = t / T;
            
            document.getElementById('softwareResult').innerHTML = `
                <ul class="list-group">
                    <li class="list-group-item">Трудоёмкость t = 3.6·n<sup>1.2</sup> = ${t.toFixed(2)} чел.-мес.</li>
                    <li class="list-group-item">Длительность T = 2.5·t<sup>0.32</sup> = ${T.toFixed(2)} мес.</li>
                    <li class="list-group-item">Производительность Пр = 1000·n / t = ${Pr.toFixed(2)} исх. команд/чел.-мес.</li>
                    <li class="list-group-item">Среднее число исполнителей Чп = t / T = ${Ch.toFixed(2)} чел.</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
