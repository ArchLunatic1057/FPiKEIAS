<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Капитальные затраты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Расчёт капитальных затрат на создание ИАС</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="capitalForm">
                            <div class="mb-3">
                                <label class="form-label">Сметная стоимость КТС (Р<sub>ктс</sub>), руб.</label>
                                <input type="number" step="any" id="p_ktc" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Затраты на установку, монтаж и запуск (Р<sub>монт</sub>), руб.</label>
                                <input type="number" step="any" id="p_mont" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Затраты на производственно-хозяйственный инвентарь (Р<sub>инв</sub>), руб.</label>
                                <input type="number" step="any" id="p_inv" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Затраты на строительство и реконструкцию зданий (Р<sub>зд</sub>), руб.</label>
                                <input type="number" step="any" id="p_zd" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Сумма оборотных средств (Р<sub>ос</sub>), руб.</label>
                                <input type="number" step="any" id="p_os" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Транспортно-заготовительные расходы (Р<sub>тр</sub>), руб.</label>
                                <input type="number" step="any" id="p_tr" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Сметная стоимость системы стандартного обеспечения (Р<sub>соп</sub>), руб.</label>
                                <input type="number" step="any" id="p_sop" class="form-control" required>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="use_vysv">
                                <label class="form-check-label" for="use_vysv">Учесть остаточную стоимость высвобожденных средств</label>
                            </div>

                            <div id="vysv_inputs" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Первоначальная стоимость высвобожденных средств (Р'<sub>в</sub>), руб.</label>
                                    <input type="number" step="any" id="p_v_first" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Годовая норма амортизации (a)</label>
                                    <input type="number" step="0.01" id="a_norm" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Срок эксплуатации высвобожденного оборудования (Т<sub>техн</sub>), лет</label>
                                    <input type="number" step="0.1" id="t_tehn" class="form-control">
                                </div>
                            </div>

                            <button type="button" class="btn btn-primary" onclick="calculateCapital()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результаты:</h4>
                        <div id="capitalResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        document.getElementById('use_vysv').addEventListener('change', function(e) {
            document.getElementById('vysv_inputs').style.display = e.target.checked ? 'block' : 'none';
        });
        
        function calculateCapital() {
            const p_ktc = parseFloat(document.getElementById('p_ktc').value);
            const p_mont = parseFloat(document.getElementById('p_mont').value);
            const p_inv = parseFloat(document.getElementById('p_inv').value);
            const p_zd = parseFloat(document.getElementById('p_zd').value);
            const p_os = parseFloat(document.getElementById('p_os').value);
            const p_tr = parseFloat(document.getElementById('p_tr').value);
            const p_sop = parseFloat(document.getElementById('p_sop').value);
            
            if (isNaN(p_ktc) || isNaN(p_mont) || isNaN(p_inv) || isNaN(p_zd) || isNaN(p_os) || isNaN(p_tr) || isNaN(p_sop)) {
                document.getElementById('capitalResult').innerHTML = '<div class="alert alert-danger">Проверьте введённые значения</div>';
                return;
            }
            
            let p_vysv = 0;
            const use_vysv = document.getElementById('use_vysv').checked;
            
            if (use_vysv) {
                const p_v_first = parseFloat(document.getElementById('p_v_first').value);
                const a_norm = parseFloat(document.getElementById('a_norm').value);
                const t_tehn = parseFloat(document.getElementById('t_tehn').value);
                
                if (isNaN(p_v_first) || isNaN(a_norm) || isNaN(t_tehn)) {
                    document.getElementById('capitalResult').innerHTML = '<div class="alert alert-danger">Введите данные для высвобожденных средств</div>';
                    return;
                }
                p_vysv = p_v_first * (1 - a_norm * t_tehn);
            }
            
            const p_k = (p_ktc + p_mont + p_inv + p_zd + p_os + p_tr + p_sop) - p_vysv;
            
            document.getElementById('capitalResult').innerHTML = `
                <ul class="list-group">
                    <li class="list-group-item">Остаточная стоимость высвобожденных средств Р<sub>высв</sub> = ${p_vysv.toFixed(2)} руб.</li>
                    <li class="list-group-item">Капитальные затраты Р<sub>к</sub> = ${p_k.toFixed(2)} руб.</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
