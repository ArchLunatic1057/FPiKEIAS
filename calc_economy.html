<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт годовой экономии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Расчёт годовой экономии (прироста прибыли) по составляющим</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="economyForm">
                            <div class="mb-3">
                                <label class="form-label">Экономия от сокращения затрат трудовых и материальных ресурсов (П₁), руб./год</label>
                                <input type="number" step="any" id="p1" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Экономия от повышения качества и потребительских свойств (П₂), руб./год</label>
                                <input type="number" step="any" id="p2" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Дополнительная прибыль от приоритетной новизны (П₃), руб./год</label>
                                <input type="number" step="any" id="p3" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Сокращение длительности автоматизируемого процесса ΔT, лет</label>
                                <input type="number" step="any" id="dt" class="form-control" required>
                            </div>
                            <button type="button" class="btn btn-primary" onclick="calculateEconomy()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результат:</h4>
                        <div id="economyResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        const EN = 0.2;
        
        function calculateEconomy() {
            const P1 = parseFloat(document.getElementById('p1').value);
            const P2 = parseFloat(document.getElementById('p2').value);
            const P3 = parseFloat(document.getElementById('p3').value);
            const DT = parseFloat(document.getElementById('dt').value);
            
            if (isNaN(P1) || isNaN(P2) || isNaN(P3) || isNaN(DT)) {
                document.getElementById('economyResult').innerHTML = '<div class="alert alert-danger">Введите числовые значения</div>';
                return;
            }
            
            const total = (P1 + P2 + P3) * (1 + EN * DT);
            document.getElementById('economyResult').innerHTML = `<div class="alert alert-success">Годовая экономия П = ${total.toFixed(2)} руб./год</div>`;
        }
    </script>
</body>
</html>
