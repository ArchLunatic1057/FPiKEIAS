<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Годовой экономический эффект</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Годовой экономический эффект и сопутствующие показатели</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="effForm">
                            <div class="mb-3">
                                <label class="form-label">Годовая экономия (прирост прибыли) П, тыс. руб.</label>
                                <input type="number" step="any" id="profit" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Суммарные затраты на создание и внедрение К, тыс. руб.</label>
                                <input type="number" step="any" id="total_costs" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Единовременные затраты на разработку и внедрение Р, тыс. руб.</label>
                                <input type="number" step="any" id="single_costs" class="form-control" required>
                            </div>
                            <button type="button" class="btn btn-primary" onclick="calculateEff()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результаты:</h4>
                        <div id="effResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        function calculateEff() {
            const P = parseFloat(document.getElementById('profit').value);
            const K = parseFloat(document.getElementById('total_costs').value);
            const R = parseFloat(document.getElementById('single_costs').value);
            
            if (isNaN(P) || isNaN(K) || isNaN(R)) {
                document.getElementById('effResult').innerHTML = '<div class="alert alert-danger">Проверьте корректность введённых данных</div>';
                return;
            }
            
            const E = P - K;
            const Ek = P / R;
            const T = R / P;
            
            document.getElementById('effResult').innerHTML = `
                <ul class="list-group">
                    <li class="list-group-item">Годовой экономический эффект Э = П – К = ${E.toFixed(2)} тыс. руб.</li>
                    <li class="list-group-item">Коэффициент эффективности E<sub>к</sub> = П / Р = ${Ek.toFixed(4)}</li>
                    <li class="list-group-item">Срок окупаемости Т = Р / П = ${T.toFixed(2)} лет</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
