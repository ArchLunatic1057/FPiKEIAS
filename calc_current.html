<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текущие затраты на функционирование</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Расчёт годовых текущих затрат на функционирование ИАС</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="currentForm">
                            <div class="mb-3">
                                <label class="form-label">Метод расчёта:</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="current_method" id="method_first" value="first" checked>
                                    <label class="form-check-label" for="method_first">Первый метод (через составляющие)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="current_method" id="method_second" value="second">
                                    <label class="form-check-label" for="method_second">Второй метод (сумма затрат по задачам)</label>
                                </div>
                            </div>

                            <div id="first_inputs">
                                <div class="mb-3">
                                    <label class="form-label">Годовые затраты на эксплуатацию КТС (И<sub>ктс</sub>), руб./год</label>
                                    <input type="number" step="any" id="i_kts" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Затраты на поддержание и актуализацию ПО (И<sub>сон</sub>), руб./год</label>
                                    <input type="number" step="any" id="i_son" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Затраты на содержание и ремонт помещений (И<sub>н</sub>), руб./год</label>
                                    <input type="number" step="any" id="i_n" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Зарплата группы эксплуатации с начислениями (И<sub>з</sub>), руб./год</label>
                                    <input type="number" step="any" id="i_z_eks" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Зарплата специалистов с начислениями (И<sub>з</sub>), руб./год</label>
                                    <input type="number" step="any" id="i_z_spec" class="form-control">
                                </div>
                            </div>

                            <div id="second_inputs" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Количество решаемых задач (n)</label>
                                    <input type="number" id="n_tasks" class="form-control" min="1" value="1">
                                </div>
                                <div id="tasks-container">
                                    <div class="mb-2">
                                        <label class="form-label">Затраты на задачу 1, руб./год</label>
                                        <input type="number" step="any" name="task_0" class="form-control">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Общесистемные затраты за год (И<sub>сист</sub>), руб./год</label>
                                    <input type="number" step="any" id="i_sist" class="form-control">
                                </div>
                            </div>

                            <button type="button" class="btn btn-primary" onclick="calculateCurrent()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результат:</h4>
                        <div id="currentResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        // Переключение методов
        document.querySelectorAll('input[name="current_method"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('first_inputs').style.display = this.value === 'first' ? 'block' : 'none';
                document.getElementById('second_inputs').style.display = this.value === 'second' ? 'block' : 'none';
            });
        });
        
        // Динамическое добавление полей для задач
        function updateTasksContainer() {
            const n = parseInt(document.getElementById('n_tasks').value) || 1;
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            for (let i = 0; i < n; i++) {
                const div = document.createElement('div');
                div.className = 'mb-2';
                div.innerHTML = `<label class="form-label">Затраты на задачу ${i+1}, руб./год</label><input type="number" step="any" name="task_${i}" class="form-control task-input">`;
                container.appendChild(div);
            }
        }
        
        document.getElementById('n_tasks').addEventListener('input', updateTasksContainer);
        
        function calculateCurrent() {
            const method = document.querySelector('input[name="current_method"]:checked').value;
            
            if (method === 'first') {
                const i_kts = parseFloat(document.getElementById('i_kts').value);
                const i_son = parseFloat(document.getElementById('i_son').value);
                const i_n = parseFloat(document.getElementById('i_n').value);
                const i_z_eks = parseFloat(document.getElementById('i_z_eks').value);
                const i_z_spec = parseFloat(document.getElementById('i_z_spec').value);
                
                if (isNaN(i_kts) || isNaN(i_son) || isNaN(i_n) || isNaN(i_z_eks) || isNaN(i_z_spec)) {
                    document.getElementById('currentResult').innerHTML = '<div class="alert alert-danger">Проверьте ввод данных</div>';
                    return;
                }
                
                const i_ksa = i_kts + i_son + i_n + i_z_eks;
                const i_g = i_ksa + i_z_spec;
                
                document.getElementById('currentResult').innerHTML = `<div class="alert alert-success">Годовые текущие затраты И<sub>г</sub> = ${i_g.toFixed(2)} руб./год (Первый метод)</div>`;
                
            } else {
                const n_tasks = parseInt(document.getElementById('n_tasks').value) || 1;
                let sum_Ii = 0;
                let valid = true;
                
                for (let i = 0; i < n_tasks; i++) {
                    const val = parseFloat(document.querySelector(`input[name="task_${i}"]`).value);
                    if (isNaN(val)) {
                        valid = false;
                        break;
                    }
                    sum_Ii += val;
                }
                
                const i_sist = parseFloat(document.getElementById('i_sist').value);
                if (isNaN(i_sist)) valid = false;
                
                if (!valid) {
                    document.getElementById('currentResult').innerHTML = '<div class="alert alert-danger">Проверьте ввод данных для всех задач</div>';
                    return;
                }
                
                const i_g = sum_Ii + i_sist;
                document.getElementById('currentResult').innerHTML = `<div class="alert alert-success">Годовые текущие затраты И<sub>г</sub> = ${i_g.toFixed(2)} руб./год (Второй метод, сумма по ${n_tasks} задачам)</div>`;
            }
        }
    </script>
</body>
</html>
