<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предпроизводственные затраты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Расчёт предпроизводственных затрат</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="preprodForm">
                            <div class="mb-3">
                                <label class="form-label">Метод расчёта:</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="preprod_method" id="method_comp" value="components" checked>
                                    <label class="form-check-label" for="method_comp">По составляющим</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="preprod_method" id="method_labor" value="labor">
                                    <label class="form-check-label" for="method_labor">Через трудоёмкость (сметная стоимость)</label>
                                </div>
                            </div>

                            <div id="comp_inputs">
                                <div class="mb-3">
                                    <label class="form-label">Затраты на проектирование (П<sub>ИП</sub>), руб.</label>
                                    <input type="number" step="any" id="p_ip" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Затраты на программирование (П<sub>ПО</sub>), руб.</label>
                                    <input type="number" step="any" id="p_po" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Затраты на подготовку информационного обеспечения (П<sub>ИО</sub>), руб.</label>
                                    <input type="number" step="any" id="p_io" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Затраты на отладку и ввод (П<sub>ВВ</sub>), руб.</label>
                                    <input type="number" step="any" id="p_bb" class="form-control">
                                </div>
                            </div>

                            <div id="labor_inputs" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Приведённая трудоёмкость t<sub>пр</sub>, чел.-дн.</label>
                                    <input type="number" step="any" id="t_pr" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Стоимость 1 чел.-дн. (С<sub>д</sub>), руб.</label>
                                    <input type="number" step="any" id="c_d" class="form-control">
                                </div>
                            </div>

                            <button type="button" class="btn btn-primary" onclick="calculatePreprod()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результат:</h4>
                        <div id="preprodResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        document.querySelectorAll('input[name="preprod_method"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('comp_inputs').style.display = this.value === 'components' ? 'block' : 'none';
                document.getElementById('labor_inputs').style.display = this.value === 'labor' ? 'block' : 'none';
            });
        });
        
        function calculatePreprod() {
            const method = document.querySelector('input[name="preprod_method"]:checked').value;
            let P_ii = 0;
            
            if (method === 'components') {
                const p_ip = parseFloat(document.getElementById('p_ip').value);
                const p_po = parseFloat(document.getElementById('p_po').value);
                const p_io = parseFloat(document.getElementById('p_io').value);
                const p_bb = parseFloat(document.getElementById('p_bb').value);
                
                if (isNaN(p_ip) || isNaN(p_po) || isNaN(p_io) || isNaN(p_bb)) {
                    document.getElementById('preprodResult').innerHTML = '<div class="alert alert-danger">Введите числовые значения для всех составляющих</div>';
                    return;
                }
                P_ii = p_ip + p_po + p_io + p_bb;
            } else {
                const t_pr = parseFloat(document.getElementById('t_pr').value);
                const c_d = parseFloat(document.getElementById('c_d').value);
                
                if (isNaN(t_pr) || isNaN(c_d)) {
                    document.getElementById('preprodResult').innerHTML = '<div class="alert alert-danger">Введите трудоёмкость и стоимость чел.-дня</div>';
                    return;
                }
                P_ii = t_pr * c_d;
            }
            
            document.getElementById('preprodResult').innerHTML = `<div class="alert alert-success">Предпроизводственные затраты П<sub>ИИ</sub> = ${P_ii.toFixed(2)} руб.</div>`;
        }
    </script>
</body>
</html>
