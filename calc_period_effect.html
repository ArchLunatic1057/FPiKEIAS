<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экономический эффект за расчётный период</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Главная</a>
            <a class="navbar-brand" href="module1.html">Модуль 1</a>
        </div>
    </nav>

    <main class="container min-vh-100">
        <h2>Расчёт экономического эффекта за весь расчётный период</h2>
        <p>Введите данные для каждого года относительно расчётного года (0 – расчётный год, отрицательные – предшествующие, положительные – следующие).</p>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="periodForm">
                            <div id="years-container">
                                <div class="row year-row mb-2">
                                    <div class="col-md-2"><input type="number" class="form-control year" placeholder="Год" value="0" required></div>
                                    <div class="col-md-3"><input type="number" step="any" class="form-control profit" placeholder="Экономия П_t, руб." required></div>
                                    <div class="col-md-3"><input type="number" step="any" class="form-control cost" placeholder="Затраты К_t, руб." required></div>
                                    <div class="col-md-2"><button type="button" class="btn btn-danger remove-year">Удалить</button></div>
                                </div>
                            </div>
                            <button type="button" id="add-year" class="btn btn-secondary mb-3">Добавить год</button>
                            <br>
                            <button type="button" class="btn btn-primary" onclick="calculatePeriodEffect()">Рассчитать</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4>Результаты:</h4>
                        <div id="periodResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">© 2026 Система автоматизированных расчётов</div>
    </footer>

    <script>
        const ALPHA_PREV = {1:1.100,2:1.210,3:1.331,4:1.464,5:1.611};
        const ALPHA_NEXT = {1:0.9091,2:0.8264,3:0.7513,4:0.6830,5:0.6209};
        const ALPHA_ZERO = 1.0;
        
        let yearIndex = 1;
        document.getElementById('add-year').addEventListener('click', function() {
            const container = document.getElementById('years-container');
            const newRow = document.createElement('div');
            newRow.className = 'row year-row mb-2';
            newRow.innerHTML = `
                <div class="col-md-2"><input type="number" class="form-control year" placeholder="Год" required></div>
                <div class="col-md-3"><input type="number" step="any" class="form-control profit" placeholder="Экономия П_t, руб." required></div>
                <div class="col-md-3"><input type="number" step="any" class="form-control cost" placeholder="Затраты К_t, руб." required></div>
                <div class="col-md-2"><button type="button" class="btn btn-danger remove-year">Удалить</button></div>
            `;
            container.appendChild(newRow);
        });
        
        document.getElementById('years-container').addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-year')) {
                e.target.closest('.year-row').remove();
            }
        });
        
        function calculatePeriodEffect() {
            const rows = document.querySelectorAll('.year-row');
            let P0_sum = 0, K0_sum = 0;
            const yearsData = [];
            
            for (const row of rows) {
                const year = parseInt(row.querySelector('.year').value);
                const profit = parseFloat(row.querySelector('.profit').value);
                const cost = parseFloat(row.querySelector('.cost').value);
                
                if (isNaN(year) || isNaN(profit) || isNaN(cost)) continue;
                
                let alpha;
                if (year < 0) alpha = ALPHA_PREV[Math.abs(year)] || 1.0;
                else if (year > 0) alpha = ALPHA_NEXT[year] || 1.0;
                else alpha = ALPHA_ZERO;
                
                P0_sum += profit * alpha;
                K0_sum += cost * alpha;
                yearsData.push({year, profit, cost, alpha: alpha.toFixed(4)});
            }
            
            const omega = P0_sum - K0_sum;
            
            let tableHtml = '<table class="table table-bordered table-striped"><thead><tr><th>Год</th><th>Экономия П_t, руб.</th><th>Затраты К_t, руб.</th><th>Коэффициент приведения α<sub>t</sub></th></tr></thead><tbody>';
            for (const y of yearsData) {
                tableHtml += `<tr><td>${y.year}</td><td>${y.profit}</td><td>${y.cost}</td><td>${y.alpha}</td></tr>`;
            }
            tableHtml += '</tbody></table>';
            tableHtml += `<ul class="list-group"><li class="list-group-item">Суммарная приведённая экономия П<sub>0</sub> = ${P0_sum.toFixed(2)} руб.</li>`;
            tableHtml += `<li class="list-group-item">Суммарные приведённые затраты К<sub>0</sub> = ${K0_sum.toFixed(2)} руб.</li>`;
            tableHtml += `<li class="list-group-item">Экономический эффект Ω = П<sub>0</sub> – К<sub>0</sub> = ${omega.toFixed(2)} руб.</li></ul>`;
            
            document.getElementById('periodResult').innerHTML = tableHtml;
        }
    </script>
</body>
</html>
