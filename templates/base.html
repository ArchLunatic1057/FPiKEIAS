<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ИАС: Экономическая эффективность{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">Главная</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Переключить навигацию"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module1.index') }}">Модуль 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module2.index') }}">Модуль 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module3.index') }}">Модуль 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module4.index') }}">Модуль 4</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module5.index') }}">Модуль 5</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module6.index') }}">Модуль 6</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module7.index') }}">Модуль 7</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('module8.index') }}">Модуль 8</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container min-vh-100">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            © 2026 Система автоматизированных расчётов. Все права защищены.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
